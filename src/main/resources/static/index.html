<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Pro | Gerenciamento </title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (Utilizado para utilitários e sistema de design moderno) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        },
                        dark: {
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos globais e microinterações customizadas */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animações para Notificações Toast */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }

        .toast-enter {
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @media (max-width: 640px) {
            .toast-enter {
                animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
        }

        .toast-exit {
            animation: fadeOut 0.25s ease forwards;
        }

        /* Scrollbar suave e elegante */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col md:flex-row bg-slate-50 text-slate-800 font-sans">

<!-- CONTAINER DE TOASTS FLUTUANTES (Top-right no Desktop, Bottom-center no Mobile) -->

<!-- OVERLAY ESCURO PARA DRAWER MOBILE -->

<!-- JAVASCRIPT TOTALMENTE COMPATÍVEL E OTIMIZADO -->
<script>
    // Controladores da Interface (Drawer e Modais)
    function toggleDrawer() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('drawerOverlay');
        const isOpen = !sidebar.classList.contains('-translate-x-full');

        if (isOpen) {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        } else {
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            sidebar.classList.remove('-translate-x-full');
        }
    }

    // Sistema de Notificações Toast Avançado
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');

        const isSuccess = type === 'success';
        const bgColor = isSuccess ? 'bg-slate-900 border-emerald-500/40 text-white' : 'bg-slate-900 border-rose-500/40 text-white';
        const iconColor = isSuccess ? 'text-emerald-400' : 'text-rose-400';
        const iconSvg = isSuccess
            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>'
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>';

        toast.className = `toast-enter pointer-events-auto flex items-center justify-between gap-3 px-4 py-3.5 rounded-2xl border shadow-xl ${bgColor}`;
        toast.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="p-1 rounded-lg bg-slate-800 ${iconColor}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">${iconSvg}</svg>
                    </div>
                    <span class="text-sm font-medium leading-tight">${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            `;

        container.appendChild(toast);

        setTimeout(() => {
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => toast.remove(), 250);
        }, 3500);
    }

    // Troca de Abas com sincronização de botões e título
    function switchTab(tabName, element) {
        // Esconde todas as seções
        document.querySelectorAll('.section').forEach(sec => sec.classList.add('hidden'));

        // Exibe a seção ativa
        const activeSection = document.getElementById(tabName + '-section');
        if(activeSection) activeSection.classList.remove('hidden');

        // Atualiza Título da Página
        const pageTitle = document.getElementById('page-title');
        const headerActions = document.getElementById('header-actions');

        if (tabName === 'products') {
            pageTitle.innerText = 'Gerenciamento de Produtos';
            headerActions.style.display = 'flex';
            loadProducts();
        } else if (tabName === 'users') {
            pageTitle.innerText = 'Gerenciamento de Clientes';
            headerActions.style.display = 'none';
            loadUsers();
        } else if (tabName === 'orders') {
            pageTitle.innerText = 'Gerenciamento de Pedidos';
            headerActions.style.display = 'none';
            loadOrders();
        }

        // Atualiza visual da Sidebar Desktop
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/25');
            item.classList.add('text-slate-400', 'hover:text-white', 'hover:bg-slate-800/60');
        });

        // Atualiza Bottom Nav Mobile
        document.querySelectorAll('.bottom-nav-item').forEach(item => {
            item.classList.remove('text-blue-600');
            item.classList.add('text-slate-400');
        });

        // Ativa o item clicado se fornecido
        if (element) {
            if (element.classList.contains('nav-item')) {
                element.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/25');
                element.classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-slate-800/60');
            } else if (element.classList.contains('bottom-nav-item')) {
                element.classList.add('text-blue-600');
                element.classList.remove('text-slate-400');
            }
        }

        // Fecha o drawer mobile se aberto
        const sidebar = document.getElementById('sidebar');
        if (!sidebar.classList.contains('-translate-x-full')) {
            toggleDrawer();
        }
    }

    // --- CRUD E LÓGICA DE PRODUTOS ---

    async function loadProducts() {
        try {
            const response = await fetch('/products');
            const products = await response.json();

            const tbody = document.getElementById('productTableBody');
            const cardsBody = document.getElementById('productCardsBody');
            const emptyState = document.getElementById('products-empty');

            if (!products || products.length === 0) {
                tbody.innerHTML = '';
                cardsBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Renderiza Tabela Desktop
            tbody.innerHTML = products.map(p => {
                const categoriasHtml = p.categories && p.categories.length > 0
                    ? p.categories.map(c => `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200/60">${c.name}</span>`).join(' ')
                    : '<span class="text-slate-400 text-xs">Sem categoria</span>';

                return `
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="py-4 px-6 font-mono text-xs text-slate-500">#${p.id}</td>
                            <td class="py-4 px-6 font-semibold text-slate-900">${p.name}</td>
                            <td class="py-4 px-6 font-medium text-emerald-600">R$ ${p.price.toFixed(2)}</td>
                            <td class="py-4 px-6 text-slate-500 max-w-xs truncate">${p.descriptionString || '-'}</td>
                            <td class="py-4 px-6">${categoriasHtml}</td>
                            <td class="py-4 px-6 text-right">
                                <div class="inline-flex items-center gap-1.5">
                                    <button onclick="editProduct(${p.id}, '${escapeHtml(p.name)}', ${p.price}, '${escapeHtml(p.descriptionString || '')}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200/60 transition">
                                        Editar
                                    </button>
                                    <button onclick="deleteProduct(${p.id})" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200/60 transition">
                                        Excluir
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
            }).join('');

            // Renderiza Cards Mobile (< 768px)
            cardsBody.innerHTML = products.map(p => {
                const categoriasHtml = p.categories && p.categories.length > 0
                    ? p.categories.map(c => `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-amber-50 text-amber-700 border border-amber-200/60">${c.name}</span>`).join(' ')
                    : '';

                return `
                        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                            <div class="flex items-start justify-between gap-3">
                                <div class="space-y-0.5">
                                    <span class="font-mono text-[11px] text-slate-400">#${p.id}</span>
                                    <h4 class="font-bold text-slate-900 text-base leading-snug">${p.name}</h4>
                                </div>
                                <span class="px-2.5 py-1 rounded-xl text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200/60 shrink-0">
                                    R$ ${p.price.toFixed(2)}
                                </span>
                            </div>

                            ${p.descriptionString ? `<p class="text-xs text-slate-500 line-clamp-2">${p.descriptionString}</p>` : ''}

                            ${categoriasHtml ? `<div class="flex flex-wrap gap-1 pt-1">${categoriasHtml}</div>` : ''}

                            <div class="pt-2 border-t border-slate-100 flex items-center justify-end gap-2">
                                <button onclick="editProduct(${p.id}, '${escapeHtml(p.name)}', ${p.price}, '${escapeHtml(p.descriptionString || '')}')" class="flex-1 py-2 rounded-xl text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200/60 transition active:scale-95 text-center">
                                    Editar
                                </button>
                                <button onclick="deleteProduct(${p.id})" class="flex-1 py-2 rounded-xl text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200/60 transition active:scale-95 text-center">
                                    Excluir
                                </button>
                            </div>
                        </div>
                    `;
            }).join('');

        } catch (error) {
            console.error('Erro ao carregar produtos:', error);
            showToast('Erro ao carregar a lista de produtos!', 'error');
        }
    }

    function escapeHtml(str) {
        return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function showProductForm(isEditing = false) {
        document.getElementById('product-form-container').classList.remove('hidden');
        document.getElementById('form-title').innerText = isEditing ? 'Editar Produto' : 'Cadastrar Novo Produto';
    }

    function cancelProductForm() {
        document.getElementById('productForm').reset();
        document.getElementById('productId').value = '';
        document.getElementById('product-form-container').classList.add('hidden');
    }

    function editProduct(id, name, price, descriptionString) {
        document.getElementById('productId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('price').value = price;
        document.getElementById('descriptionString').value = descriptionString === 'null' ? '' : descriptionString;
        showProductForm(true);
    }

    async function saveProduct(event) {
        event.preventDefault();

        const id = document.getElementById('productId').value;
        const productData = {
            name: document.getElementById('name').value,
            price: parseFloat(document.getElementById('price').value),
            descriptionString: document.getElementById('descriptionString').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/products/${id}` : '/products';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            });

            if (response.ok) {
                showToast(id ? 'Produto atualizado com sucesso!' : 'Produto cadastrado com sucesso!', 'success');
                cancelProductForm();
                loadProducts();
            } else {
                showToast('Erro ao salvar o produto.', 'error');
            }
        } catch (error) {
            console.error('Erro na requisição:', error);
            showToast('Erro de conexão com o servidor.', 'error');
        }
    }

    async function deleteProduct(id) {
        if (!confirm('Tem certeza que deseja excluir este produto?')) return;

        try {
            const response = await fetch(`/products/${id}`, { method: 'DELETE' });
            if (response.ok) {
                showToast('Produto excluído com sucesso!', 'success');
                loadProducts();
            } else {
                showToast('Erro ao excluir produto. Verifique se ele está vinculado a algum pedido.', 'error');
            }
        } catch (error) {
            console.error('Erro na requisição:', error);
            showToast('Erro de conexão com o servidor.', 'error');
        }
    }

    async function loadUsers() {
        try {
            const response = await fetch('/users');
            const users = await response.json();

            // Tabela Desktop
            document.getElementById('userTableBody').innerHTML = users.map(u => `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="py-4 px-6 font-mono text-xs text-slate-500">#${u.id}</td>
                        <td class="py-4 px-6 font-semibold text-slate-900">${u.name}</td>
                        <td class="py-4 px-6 text-slate-600">${u.email}</td>
                        <td class="py-4 px-6 text-slate-500">${u.phone || '-'}</td>
                    </tr>
                `).join('');

            // Cards Mobile
            document.getElementById('userCardsBody').innerHTML = users.map(u => `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-3.5">
                        <div class="w-10 h-10 rounded-full bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 font-bold text-sm shrink-0">
                            ${u.name.charAt(0)}
                        </div>
                        <div class="min-w-0 flex-1 space-y-0.5">
                            <h4 class="font-bold text-slate-900 text-sm truncate">${u.name}</h4>
                            <p class="text-xs text-slate-500 truncate">${u.email}</p>
                            <p class="text-[11px] font-mono text-slate-400">${u.phone || 'Sem telefone'}</p>
                        </div>
                    </div>
                `).join('');

        } catch (e) {
            console.error('Erro ao carregar usuários', e);
            showToast('Erro ao carregar clientes.', 'error');
        }
    }

    async function loadOrders() {
        try {
            const response = await fetch('/orders');
            const orders = await response.json();

            // Tabela Desktop
            document.getElementById('orderTableBody').innerHTML = orders.map(o => `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="py-4 px-6 font-mono text-xs text-slate-500">#${o.id}</td>
                        <td class="py-4 px-6 text-slate-600">${o.moment}</td>
                        <td class="py-4 px-6">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200/60">
                                ${o.orderStatus}
                            </span>
                        </td>
                        <td class="py-4 px-6 font-medium text-slate-900">${o.client ? o.client.name : 'N/A'}</td>
                    </tr>
                `).join('');

            // Cards Mobile
            document.getElementById('orderCardsBody').innerHTML = orders.map(o => `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="font-mono text-xs font-bold text-slate-400">Pedido #${o.id}</span>
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200/60">
                                ${o.orderStatus}
                            </span>
                        </div>
                        <div class="space-y-0.5">
                            <p class="text-xs font-semibold text-slate-800">Cliente: ${o.client ? o.client.name : 'N/A'}</p>
                            <p class="text-[11px] text-slate-400">${o.moment}</p>
                        </div>
                    </div>
                `).join('');

        } catch (e) {
            console.error('Erro ao carregar pedidos', e);
            showToast('Erro ao carregar pedidos.', 'error');
        }
    }

    // Inicialização
    loadProducts();
</script>
</body>
</html>
