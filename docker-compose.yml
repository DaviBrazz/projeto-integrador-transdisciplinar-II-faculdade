version: '3.8'

services:
  store-database:
    image: postgres:16-alpine
    container_name: store-database # Nome fixo ou use a variável ${DB_NAME}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - store-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  store-backend:
    build: .
    container_name: store_backend
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      # O DB_HOST precisa apontar exatamente para o nome do serviço do banco acima:
      DB_HOST: store-database
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      store-database:
        condition: service_healthy
    networks:
      - store-net

volumes:
  postgres_data:

networks:
  store-net:
    driver: bridge